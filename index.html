<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SOAOWN</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header>
    <p class="site-title">
      <a href="index.html">SOAOWN</a>
    </p>
    <nav>
      <ul>
        <li><a href="book.html">BOOK</a></li>
        <li><a href="blog.html">BLOG</a></li>
        <li><a href="knowledge.html" onclick="guardKnowledge(event)">KNOWLEDGE</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <div class="profile-section">
      <iframe class="music-video" src="https://www.youtube.com/embed/5ldiB3pgEKY" title="YouTube video player"
        frameborder="0" allowfullscreen>
      </iframe>
    </div>
  </main>

  <div id="log-container"></div>

  <script>
    fetch("log.html")
      .then(res => res.text())
      .then(data => {
        document.getElementById("log-container").innerHTML = data;
      });
  </script>

  <button class="admin-btn" onclick="openAdminPopup()">ADMIN</button>
  <script>
    const ADMIN_PASSWORD = "0310";

    function isAdminMode() {
      return localStorage.getItem("adminMode") === "true";
    }

    function applyAdminMode() {
      document.body.classList.toggle("admin-mode", isAdminMode());
    }

    function openAdminPopup() {
      const popup = document.getElementById("admin-popup") || document.getElementById("password-popup");

      if (!popup) {
        alert("ADMIN");
        return;
      }

      popup.style.display = "flex";
      const input = document.getElementById("admin-password-input");
      if (input) input.focus();
    }

    function closeAdminPopup() {
      const popup = document.getElementById("admin-popup") || document.getElementById("password-popup");

      if (!popup) return;

      popup.style.display = "none";
    }

    function submitAdminPassword() {
      const password = document.getElementById("admin-password-input").value;

      if (password === ADMIN_PASSWORD) {
        localStorage.setItem("adminMode", "true");
        applyAdminMode();
        closeAdminPopup();
      } else {
        openErrorPopup();
      }
    }

    function openErrorPopup() {
      document.getElementById("error-popup").style.display = "flex";
    }

    function closeErrorPopup() {
      document.getElementById("error-popup").style.display = "none";
    }

    function guardKnowledge(event) {
      if (!isAdminMode()) {
        event.preventDefault();
        openAdminPopup();
      }
    }

    document.addEventListener("DOMContentLoaded", applyAdminMode);
  </script>

  <button class="fab-top">⌃</button>
  <script>
    document.querySelector(".fab-top").addEventListener("click", () => {
      window.scrollTo({
        top: 0,
        behavior: "smooth"
      });
    });
  </script>

  <div class="floating-text">
    ©Collected since 2025-2026 Seoul by soaown
  </div>

  <div id="admin-popup" class="password-popup" style="display:none;">
    <div class="password-box">
      <p>access log</p>

      <input type="password" id="admin-password-input" placeholder="••••"
        onkeydown="if(event.key==='Enter') submitAdminPassword()">

      <div class="password-buttons">
        <button onclick="closeAdminPopup()">CLOSE</button>
        <button onclick="submitAdminPassword()">ENTER</button>
      </div>
    </div>
  </div>

  <div id="error-popup" class="password-popup" style="display:none;">
    <div class="password-box">
      <p class="error-text">
        <img src="/soaown/assets/sleep.png" class="sleepy-img">
      </p>
      <div class="password-buttons">
        <button onclick="closeErrorPopup()">OK</button>
      </div>
    </div>
  </div>

</body>

</html>
