<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BOOK | SOAOWN</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="icon" type="image/png" sizes="32x32" href="/soaown/assets/blue.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/soaown/assets/blue.png">
</head>

<body data-category="BOOK">

  <header>
    <p class="site-title">
      <a href="index.html">SOAOWN</a>
    </p>
    <nav>
      <ul>
        <li><a href="book.html" class="active">BOOK</a></li>
        <li><a href="blog.html">BLOG</a></li>
        <li><a href="knowledge.html" onclick="guardKnowledge(event)">KNOWLEDGE</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <h1 class="page-title">BOOK</h1>
    <div class="search-section">
      <span class="fake-search">( scan )</span>
      <input type="text" id="search-input" class="search-input"
        placeholder="search search search search search search search search............" oninput="handleSearch(event)">
      <button id="add-btn" class="add-btn" onclick="guardAddForm()">( edit )</button>
    </div>

    <div class="add-section">
      <form id="add-form" class="add-form" onsubmit="handleSubmit(event)" style="display:none;">
        <button type="button" class="cover-btn" onclick="removeCoverImage()">Remove</button>
        <input type="file" id="cover-input" accept="image/*" hidden>
        <div class="title-banner-preview">
          <textarea id="title-input" placeholder="제목" required rows="1"></textarea>
          <div class="meta-grid">
            <label><span>date: </span><input type="date" id="date-input"></label>
            <label><span>category: </span><input type="text" id="category-input"></label>
            <label><span>link: </span><input type="url" id="link-input"></label>
            <label><span>author: </span><input type="text" id="author-input"></label>
            <label><span>publisher: </span><input type="text" id="publisher-input"></label>
            <label><span>details: </span><input type="text" id="details-input"></label>
          </div>
        </div>
        <div class="editor-box">
          <div class="editor-toolbar">
            <button type="button" class="cover-btn" onclick="selectCoverImage()">
              banner
            </button>
            <button type="button" onclick="formatText('bold')">bold</button>
            <button type="button" class="align-btn" onclick="formatText('justifyCenter')">Centeralign</button>

            <!-- 글씨색 드롭다운 -->
            <div class="color-dropdown" data-mode="text">
              <button type="button" class="color-trigger" onclick="toggleColorDropdown(this)" title="글씨색"
                aria-label="글씨색">
                <span class="trigger-letter">textcolor</span>
              </button>
              <div class="color-panel">
                <button type="button" class="color-swatch" style="background:#000000"
                  onclick="pickTextColor(this,'#000000')" title="검정" aria-label="검정"></button>
                <button type="button" class="color-swatch" style="background:#ff0000"
                  onclick="pickTextColor(this,'#ff0000')" title="빨강" aria-label="빨강"></button>
                <button type="button" class="color-swatch" style="background:#ffffff"
                  onclick="pickTextColor(this,'#ffffff')" title="흰색" aria-label="흰색"></button>
                <button type="button" class="color-swatch" style="background:#245bdb"
                  onclick="pickTextColor(this,'#245bdb')" title="파랑" aria-label="파랑"></button>
              </div>
            </div>

            <!-- 하이라이트 드롭다운 -->
            <div class="color-dropdown" data-mode="highlight">
              <button type="button" class="color-trigger" onclick="toggleColorDropdown(this)" title="하이라이트"
                aria-label="하이라이트">Highligcolor
              </button>
              <div class="color-panel">
                <button type="button" class="color-swatch" style="background:#e2ff62"
                  onclick="pickHighlight(this,'#e2ff62')" title="초록" aria-label="초록"></button>
                <button type="button" class="color-swatch" style="background:#ffcafa"
                  onclick="pickHighlight(this,'#ffcafa')" title="핑크" aria-label="핑크"></button>
                <button type="button" class="color-swatch" style="background:#60b5ff"
                  onclick="pickHighlight(this,'#60b5ff')" title="파랑" aria-label="파랑"></button>
                <button type="button" class="color-swatch" style="background:#fde93a"
                  onclick="pickHighlight(this,'#fde93a')" title="흰색" aria-label="노랑"></button>
                <button type="button" class="color-swatch" style="background:#FF8400"
                  onclick="pickHighlight(this,'#FF8400')" title="주황" aria-label="주황"></button>
                <button type="button" class="color-swatch" style="background:#000000"
                  onclick="pickHighlight(this,'#000000')" title="검정" aria-label="검정"></button>
              </div>
            </div>

            <button type="button" onclick="insertFootnote()">footnote</button>
            <button type="button" onclick="insertImage()">photo</button>
            <button type="button" onclick="insertImageNextToSelected()">sidephoto</button>
            <div class="form-buttons">
              <button type="button" onclick="hideAddForm()">cancel</button>
              <button type="submit">save</button>
            </div>
          </div>
          <div id="content-input" contenteditable="true" data-placeholder="내용을 작성하세요..."></div>
        </div>
        <input type="file" id="image-input" accept="image/*" style="display:none;">
      </form>
    </div>

    <ul class="item-list"></ul>
    <div id="book-subcategory-list" class="book-subcategory-list"></div>
  </main>

  <button class="fab-top">⌃</button>
  <script>
    document.querySelector(".fab-top").addEventListener("click", () => {
      window.scrollTo({
        top: 0,
        behavior: "smooth"
      });
    });
  </script>

  <div id="admin-popup" class="password-popup" style="display:none;">
    <div class="password-box">
      <p>access log</p>
      <input type="password" id="admin-password-input" placeholder="••••"
        onkeydown="if(event.key==='Enter') submitAdminPassword()">
      <div class="password-buttons">
        <button onclick="closeAdminPopup()">CLOSE</button>
        <button onclick="submitAdminPassword()">ENTER</button>
      </div>
    </div>
  </div>


  <div class="floating-text">
    ©Collected since 2025-2026 Seoul by soaown
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
  <script src="admin.js"></script>
  <script src="script.js"></script>

</body>

</html>
